services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: "8000"
      MOLOCH_DB: /app/data/moloch.db
      MOLOCH_MAX_BUDGET_USD: "10.00"
      MOLOCH_QUEUE_SIZE: "8"
      MOLOCH_OPENROUTER_TIMEOUT: "75"
    volumes:
      - moloch-data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      MOLOCH_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  moloch-data:

